name: warehouse-ai

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warehouse-local}
    ports:
      # 5433, so that it does not clash with a locally installed PostgreSQL
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "warehouse", "-d", "warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
