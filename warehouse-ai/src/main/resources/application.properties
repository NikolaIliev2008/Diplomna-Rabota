spring.application.name=warehouse-ai
server.address=127.0.0.1

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/warehouse}
spring.datasource.username=${DB_USER:warehouse}
spring.datasource.password=${DB_PASSWORD:warehouse-local}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.vectorstore.type=none
spring.ai.chat.client.enabled=false
